# What actually runs on the droplet.
#
#     cd /srv/scipio && docker compose pull && docker compose up -d
#
# or, from a dev machine:  uv run --with paramiko python scripts/vps.py deploy
#
# Differs from deploy/docker-compose.yml in one way that matters: it has no
# `build:` sections. The box is 1 vCPU / 961 MiB and never builds anything —
# images come from GHCR, published by .github/workflows/deploy-images.yml.
#
# It is also self-contained. Only this file, `.env` and `Caddyfile` live on the
# droplet; there is no checkout, so nothing on the box can drift from main.

name: scipio

x-logging: &logging
  # Belt and braces with /etc/docker/daemon.json. A container started outside
  # this file, or a daemon config lost to a reinstall, would otherwise log
  # without limit onto a 24 GB disk — and a full disk stops Docker writing
  # layers and Caddy writing certificates at the same time.
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  api:
    image: ${API_IMAGE:?set API_IMAGE in .env, e.g. ghcr.io/hephyrius/ethglobal-lisboa-api:latest}
    pull_policy: always
    restart: unless-stopped
    logging: *logging
    env_file: [.env]
    environment:
      AGENT_MODE: live
      DEPLOY_NETWORK: ${DEPLOY_NETWORK:-base-mainnet}
      # Despite the name, most of the harness reads ANVIL_RPC_URL as "the chain
      # to talk to". Left pointing at a laptop's :8540 it would resolve to
      # nothing here, and the agent would read one chain and write another.
      ANVIL_RPC_URL: ${BASE_RPC_URL:?BASE_RPC_URL must be an archive-capable Base endpoint}
      AGENT_STATE_DIR: /var/lib/scipio/state
      AGENT_CORS_ORIGINS: https://scipio.capital,https://www.scipio.capital
    volumes:
      # NOT a cache, and the only thing on this box that cannot be recreated.
      # Mandates are recoverable only as a hash on chain, and an open Aqua
      # position is not recoverable at all — Aqua can confirm a strategy hash you
      # already hold but cannot enumerate a maker's positions. `down -v` deletes
      # positions that can then never be displayed or closed.
      - agent-state:/var/lib/scipio/state
    # 1 vCPU total. Without a ceiling, a tick that spins can starve Caddy, and
    # the symptom is the whole site timing out rather than one slow request.
    # Not a hard cap on correctness — cpus is a share, memory is a wall.
    mem_limit: 420m
    cpus: 0.7

  web:
    image: ${WEB_IMAGE:?set WEB_IMAGE in .env, e.g. ghcr.io/hephyrius/ethglobal-lisboa-web:latest}
    pull_policy: always
    restart: unless-stopped
    logging: *logging
    depends_on: [api]
    environment:
      NODE_ENV: production
      # Node sizes its heap from the CGROUP limit, but only loosely, and the
      # default on a small box is generous enough that V8 will happily grow into
      # swap before collecting. An explicit ceiling makes it collect instead.
      NODE_OPTIONS: --max-old-space-size=200
    mem_limit: 300m
    cpus: 0.5

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    logging: *logging
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account key. Losing this means re-issuing on
      # every restart, and Let's Encrypt rate-limits failures to five per
      # hostname per hour — long enough to take the site down for a demo.
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 96m

volumes:
  agent-state:
  caddy-data:
  caddy-config:
