<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!--
    The Scipio mark as a favicon. Same figure as components/brand/ScipioMark.tsx
    — a town enclosed by a wall, pressed inward — but drawn heavier: a tab icon
    renders at 16px, where the app mark's 1.3px wall and small heads blur into a
    grey square. The wall is 2px, the heads are larger and the town is a 4-unit
    block, so the shape still reads at the size it is actually shown.

    Full-bleed tile rather than an inset rounded square: browsers already round
    and inset tab icons, and doing it twice leaves the figure too small to see.
  -->
  <rect width="24" height="24" rx="4.5" fill="#005BCC"/>

  <!-- The wall. -->
  <rect x="4" y="4" width="16" height="16" fill="none" stroke="#fff" stroke-width="2"/>

  <!-- Four heads on the wall's midpoints, pointing in. -->
  <g fill="#fff">
    <polygon points="10,5.4 14,5.4 12,8.6"/>
    <polygon points="18.6,10 18.6,14 15.4,12"/>
    <polygon points="14,18.6 10,18.6 12,15.4"/>
    <polygon points="5.4,14 5.4,10 8.6,12"/>
  </g>

  <!-- The town. -->
  <rect x="10" y="10" width="4" height="4" fill="#fff"/>
</svg>
