# Build the two images and publish them to GHCR.
#
# The droplet never builds. It has 1 vCPU and 961 MiB of RAM, and `next build`
# alone peaks well above that — with the 4 GB swapfile it would probably finish,
# in something like fifteen minutes of thrashing, during which the running site
# is competing for the same CPU. Pulling a finished image takes about thirty
# seconds and costs the live stack nothing.
#
# That is also what makes updating easy: `scripts/vps.py deploy` pulls and
# restarts. No source on the box, no toolchain on the box, nothing to drift.
#
# Action versions are pinned exactly, for the same reason web/package.json pins
# every dependency exactly: a floating tag is a standing instruction to run
# whatever was published last night, on a runner holding a token that can write
# to our package registry.

name: build images

on:
  push:
    branches: [main]
    # Docs-only commits are most of this repo's history and rebuilding two
    # images for a build-log entry wastes five minutes and a runner.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'plans/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Lowercased at use — GHCR rejects an uppercase path segment, and the GitHub
  # account is mixed case.
  IMAGE_BASE: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    strategy:
      # One failing image must not cancel the other. A half-published pair is
      # recoverable; losing the log of why the first one failed is not.
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: deploy/Dockerfile.api
          - name: web
            dockerfile: deploy/Dockerfile.web

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: docker/setup-buildx-action@v3.7.1

      - uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: lowercase image name
        id: img
        run: echo "ref=${REGISTRY}/$(echo "$IMAGE_BASE" | tr '[:upper:]' '[:lower:]')-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6.9.0
        with:
          # The repo root, because both images need paths outside their own
          # directory: the API is a uv workspace, and the dApp imports
          # deployments/ from above web/.
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.img.outputs.ref }}:latest
            ${{ steps.img.outputs.ref }}:${{ github.sha }}
          # NEXT_PUBLIC_* are inlined by `next build`, so the production values
          # have to be present HERE, at build time. Setting them on the droplet
          # would do nothing: the old values are already compiled into the
          # bundle, and the failure only shows up in a visitor's browser.
          #
          # None of these is a secret — they are compiled into JavaScript that
          # anyone can read. Putting them in `secrets` would imply otherwise.
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.scipio.capital
            NEXT_PUBLIC_CHAIN_ID=8453
            DEPLOY_NETWORK=base-mainnet
          # A 1 GB droplet pulls faster when layers are shared between builds,
          # and the cache lives on GitHub rather than on the box.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      - name: what was published
        run: |
          echo "::notice::${{ steps.img.outputs.ref }}:latest"
          echo "::notice::${{ steps.img.outputs.ref }}:${{ github.sha }}"
