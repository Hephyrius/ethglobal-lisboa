[project]
name = "curator-data"
# 0.2.0: gained the `aave` and `chainlink` sources plus the `chain` subpackage.
# Bumping is not ceremony here — uv caches built wheels by name+version, so
# reusing 0.1.0 serves a stale wheel missing the new modules and fails with a
# confusing ModuleNotFoundError.
# 0.3.1: floors curator-schema at 0.2.0. 0.3.0 declared it unpinned and
# resolved against a schema without SourceNote, so it cannot import.
version = "0.4.0"
description = "Pluggable market-data registry: mandate-named sources merged into a source-agnostic MarketSnapshot"
readme = "README.md"
license = { text = "MIT" }
keywords = ["defi", "thegraph", "subgraph", "chainlink", "market-data", "agent-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Topic :: Software Development :: Libraries",
]
# 3.10 floor matches curator-schema, and is also the MCP SDK's minimum.
requires-python = ">=3.10"
dependencies = [
  # A FLOOR, not a bare name. An unpinned dependency lets the resolver pick any
  # version, and it picked the stale `0.1.0` even after `0.2.0` was published -
  # which is how `uvx curator-mcp` stayed broken after the schema was fixed.
  # `SourceNote` and the `probability` FactKind both arrived in 0.2.0.
  "curator-schema>=0.2.0",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# x402 is the risky, feature-flagged path. Nobody importing the registry should
# have to install a signing stack to read a yield.
x402 = ["eth-account>=0.11"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
curator-data = "curator_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["curator_data"]

# Ruff resolves the nearest pyproject.toml per file, so this scopes to /data
# only and leaves the root config (py312) alone for every other lane.
#
# Why 3.10 rather than the repo's 3.12: the MCP server is a separately
# installable product and its SDK's floor is 3.10, so this package must not use
# 3.11+ APIs. That rules out `datetime.UTC` (UP017) and the `TimeoutError`
# alias (UP041), which the py312 target would otherwise demand.
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
