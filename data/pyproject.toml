[project]
name = "curator-data"
version = "0.1.0"
description = "Pluggable market-data registry: mandate-named sources merged into a source-agnostic MarketSnapshot"
# 3.10 floor matches curator-schema, and is also the MCP SDK's minimum.
requires-python = ">=3.10"
dependencies = [
  "curator-schema",
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
# x402 is the risky, feature-flagged path. Nobody importing the registry should
# have to install a signing stack to read a yield.
x402 = ["eth-account>=0.11"]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
curator-data = "curator_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["curator_data"]
