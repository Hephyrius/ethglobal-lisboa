[project]
name = "agentic-vault-curation"
version = "0.1.0"
description = "An LLM agent as autonomous ERC-4626 vault curator — ETHGlobal Lisbon 2026"
requires-python = ">=3.12"
# Lanes add their own dependencies here. Keep this list minimal and shared;
# anything used by exactly one lane belongs in that lane's own section.
dependencies = [
  "curator-schema",
  "pydantic>=2.7",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "jsonschema>=4.21",
  "ruff>=0.5",
]

[tool.uv.sources]
# The frozen interface is consumed as a local editable package, so every lane
# imports the same models rather than copying shapes around.
curator-schema = { workspace = true }

[tool.uv.workspace]
members = ["packages/schema/python"]

[tool.pytest.ini_options]
testpaths = ["packages/schema/python", "agent", "data", "venues"]
asyncio_mode = "auto"
# A broken global web3 registers a pytest_ethereum plugin that breaks
# collection outside the venv. Harmless inside it; this keeps the escape hatch
# documented next to the config rather than in someone's shell history.
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
