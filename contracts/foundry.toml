[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]

solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200

# Reproducible bytecode across Windows/WSL and the macOS handoff. Without this the metadata hash
# embeds absolute compiler paths, so `out/**` — which this lane commits, because it is how the other
# four lanes get their ABIs — churns on every machine and shows up as noise in every diff.
bytecode_hash = "none"

# `out/` is committed. build_info is tens of megabytes of solc input JSON that nobody downstream
# reads; ABIs and bytecode are in the per-contract artifacts.
build_info = false

# The deploy script writes ../deployments/base-fork.json — the file every other lane reads for
# addresses instead of hardcoding them.
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 32
# Handler actions deliberately attempt things that must revert — an unauthorized execute, a
# non-allowlisted target, a role change. Failing the run on those would test nothing. Each attack
# instead increments a ghost counter when it *succeeds*, and the invariants assert those are zero,
# so a single breach anywhere in a sequence is caught and reported with the calls that produced it.
fail_on_revert = false
call_override = false

# `FOUNDRY_PROFILE=deep forge test --match-path "test/invariant/*"` — a longer hunt for the CI-less
# equivalent of an overnight run. Kept out of the default profile so the normal suite stays seconds.
[profile.deep.invariant]
runs = 512
depth = 128
fail_on_revert = false

[profile.deep.fuzz]
runs = 5000

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
base = "${BASE_RPC_URL}"
fork = "${ANVIL_RPC_URL}"

[etherscan]
base = { key = "${BASESCAN_API_KEY}", chain = 8453 }
